[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantalche"
version = "0.1.0"
description = "Quantalche Nexus signal engine backend"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "tzdata>=2024.1",
]

[tool.setuptools.packages.find]
where = ["src"]
